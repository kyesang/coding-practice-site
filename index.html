<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 개발 기록</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <h1>나의 개발 기록</h1>
      <p>개발자로 성장하는 과정을 기록합니다.</p>
    </header>

    <main>
      <section class="profile">
        <h2>About Me</h2>
        <p>안녕하세요. 개발자를 꿈꾸는 컴퓨터공학 전공 학생입니다.</p>
        <p>Java와 Python을 공부하고 있습니다.</p>
      </section>

      <section class="goal">
        <h2>My Goal</h2>
        <p>꾸준히 공부하고 직접 프로젝트를 완성하는 개발자가 되겠습니다.</p>
        <button id="helloButton">인사하기</button>
        <p id="message"></p>
      </section>

      <section class="study-log">
        <h2>Study Log</h2>
        <form id="studyForm" class="study-form">
          <input type="text" id="studyInput" placeholder="오늘 공부한 내용을 입력하세요" maxlength="200">
          <button type="submit">기록 추가</button>
        </form>
        <p id="emptyMessage" class="empty-message">아직 기록이 없습니다.</p>
        <ul id="studyList" class="study-list"></ul>
      </section>
    </main>

    <footer>
      <p>© 2026 My Development Journey</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
